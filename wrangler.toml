name = "starsync"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "starsync-db"
database_id = "4fb75c3c-52b9-449b-9801-20d38f6c2b39"

# Secret names are intentionally NOT declared here as [vars] placeholders —
# that was tried once and is actively dangerous: deploying with a [vars]
# entry whose name matches an existing Secret overwrites that Secret with
# the plain-text var value. (Found out the hard way: it silently demoted
# ENCRYPTION_KEY from a real secret to an empty plain_text binding on the
# very next deploy.) Secrets must never be declared in this file at all —
# only ever set out-of-band via `wrangler secret put <NAME> --name starsync`.
# For CI (Workers Builds) type-checking, see src/types/secrets.d.ts instead,
# which hand-declares these names for TypeScript without touching runtime
# bindings in any way.

# The daily-send pipeline (cron that queries D1 every 15 min + a queue
# consumer that calls Claude/sends email) is not built yet — see plan.md.
# Workers (unlike the now-unsupported Pages) can host Cron Triggers and
# Queue consumers directly in this same project when that's built:
#   starsync-daily-send (main queue), starsync-daily-send-dlq (dead-letter)

# Secrets (set with `wrangler secret put <NAME>`, never committed):
# ENCRYPTION_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# RAZORPAY_PLAN_ID, RESEND_API_KEY, ANTHROPIC_API_KEY
#
# Rasi/Nakshatra are computed in-process (src/lib/vedic.ts) — no astrology
# API or key needed.
