name = "starsync"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "starsync-db"
database_id = "4fb75c3c-52b9-449b-9801-20d38f6c2b39"

# Caps /api/signup abuse from a single IP — not a secret, safe to declare
# directly here (unlike API keys). namespace_id is just an arbitrary unique
# id within this account, not a separately-provisioned resource.
[[ratelimits]]
name = "SIGNUP_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Lets the Razorpay webhook handler enqueue an immediate "welcome" reading
# on subscription.authenticated, onto the exact same queue the daily cron
# in workers/daily-send already consumes from — same binding name there too,
# so this is just a second producer on one shared queue, not a new resource.
[[queues.producers]]
binding = "DAILY_SEND_QUEUE"
queue = "starsync-daily-send"

# Secret names are intentionally NOT declared here as [vars] placeholders —
# that was tried once and is actively dangerous: deploying with a [vars]
# entry whose name matches an existing Secret overwrites that Secret with
# the plain-text var value. (Found out the hard way: it silently demoted
# ENCRYPTION_KEY from a real secret to an empty plain_text binding on the
# very next deploy.) Secrets must never be declared in this file at all —
# only ever set out-of-band via `wrangler secret put <NAME> --name starsync`.
# For CI (Workers Builds) type-checking, see src/types/secrets.d.ts instead,
# which hand-declares these names for TypeScript without touching runtime
# bindings in any way.

# The daily-send pipeline (cron + queue consumer that calls OpenAI/sends
# email) lives in its own separate Worker — workers/daily-send/wrangler.toml
# — with its own build/deploy, not this project's.

# Secrets (set with `wrangler secret put <NAME>`, never committed):
# ENCRYPTION_KEY, RAZORPAY_KEY_ID, RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET,
# RAZORPAY_PLAN_ID
#
# Rasi/Nakshatra are computed in-process (src/lib/vedic.ts) — no astrology
# API or key needed.
